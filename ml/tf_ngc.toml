# CSCS Container Engine environment definition (EDF) for the NGC TensorFlow
# container, used to run the DeepSphere correction pipeline on the GH200 GPU.
#
# NGC nvidia/tensorflow:24.03-tf2-py3 ships TF 2.15 (Keras 2) built with CUDA for
# aarch64 (SBSA) — so tf.compat.v1 + tf.layers.batch_normalization work natively
# (no tf_keras shim needed) AND the H100/GH200 is visible to TF.
#
# Reference it from sbatch with:  srun --environment=/users/damrein/masterProject/ml/tf_ngc.toml ...

image = "/capstor/scratch/cscs/damrein/tf_ngc_2403.sqsh"

# Bind the home and scratch/store filesystems so code + data are visible inside.
mounts = [
    "/users/damrein:/users/damrein",
    "/capstor:/capstor",
]

workdir = "/users/damrein/masterProject/ml"

[env]
# deepsphere checkout (MLP.py imports from here).
DEEPSPHERE_PATH = "/users/damrein/deepsphere-cosmo-tf1"
# Stream stdout to the SLURM .out live.
PYTHONUNBUFFERED = "1"
# Quieten TF info logs.
TF_CPP_MIN_LOG_LEVEL = "1"
