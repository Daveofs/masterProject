[project]
name = "discodj_simulation_setup"
version = "0.1.0"
description = "Everything needed in a venv to run multigpu discodj simulations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asdf>=4.3.0",
    "astropy>=7.1.0",
    "discodj",
    "h5py>=3.14.0",
    "jax>=0.7.2",
    "jax-array-info",
    "jaxtyping>=0.3.3",
    "matplotlib>=3.10.3",
    "mpi4py>=4.1.0",
    "numpy>=2.3.1",
    "nvtx>=0.2.12",
    "pybind11[global]>=3.0.0",
    "pytest>=9.0.2",
    "pytest-jax-bench[plot]",
    "pytest-regressions>=2.9.1",
    "scipy>=1.16.0",
    "setproctitle>=1.3.6",
    "tomli-w>=1.2.0",
    "tqdm>=4.67.1",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
pyqt = [
    "pyqt6>=6.9.1",
]
gpu_cuda12 = [
    "jax[cuda12]>=0.9.0",
]
gpu_cuda12_local = [
    "jax[cuda12-local]>=0.9.0",
]
gpu_cuda13 = [
    "jax[cuda13]>=0.9.0",
    "nvidia-cuda-sanitizer-api"
]
gpu_cuda13_local = [
    "jax[cuda13-local]>=0.9.0",
]

personal = [
    "bpython>=0.25",
    "pillow>=11.3.0",
    "pyright>=1.1.408",
    "pytest>=8.4.1",
    "ruff>=0.14.13",
]
pyvista = [
    "pyvista>=0.45.3",
]

cuda_13_only = [
    "nvidia-cublas",
    "nvidia-cuda-cupti",
    "nvidia-cuda-nvcc",
    "nvidia-cuda-nvrtc",
    "nvidia-cuda-runtime",
    "nvidia-cudnn-cu13",
    "nvidia-cufft",
    "nvidia-cusolver",
    "nvidia-cusparse",
    "nvidia-nccl-cu13",
    "nvidia-nvjitlink",
    "nvidia-nvshmem-cu13",
    "nvidia-nvvm",
    "nvidia-cuda-sanitizer-api"
]

cuda_tree = [
    "cmake>=4.2.3",
    "jztree",
    "nanobind>=2.12.0",
    "scikit-build-core>=0.12.1",
    "setuptools-scm>=10.0.4",
]

inference_optimization=[
    "blackjax>=1.2.5",
    "corner>=2.2.3",
    "jaxopt>=0.8.5",
    "optax>=0.2.5",
]

docs = [
    "discodj[docs]",
]
discoeb = [
    "discoeb",
    "optimistix",
]
healpix = [
    "jax-healpy>=0.6",
    "healpy>=1.18.1",
]

[tool.uv]
no-build-isolation-package = ["jztree"]
reinstall-package = ["jztree", "discodj"]

[tool.uv.sources]
jax-array-info = { git = "https://github.com/Findus23/jax-array-info.git" }
discodj = { path = "../../../", editable = true }
fmdj = { path = "../../../../../FM-DJ/", editable = true }
jztree = { path = "../../../../../jz-tree/", editable = true }
pytest-jax-bench = { git = "https://github.com/jstuecker/pytest-jax-bench.git" }
discoeb = { git = "https://github.com/ohahn/DISCO-EB.git" }
optimistix = { git = "https://github.com/patrick-kidger/optimistix.git", rev = "b414db226f6ade1854808c40e4a6c4fc4aba7f71" }


